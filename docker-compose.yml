services:
  pvc-arvand:
    build:
      context: .
      dockerfile: Dockerfile
    image: pvc-arvand:1.0.0
    container_name: pvc-arvand
    restart: unless-stopped
    ports:
      - "${APP_PUBLISH_PORT:-8080}:8080"
    environment:
      PVC_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      PVC_DATA_DIR: /data
      PVC_STATIC_DIR: /app/static
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
    volumes:
      - pvc_arvand_data:/data
      # ARIAORMS LogSheets Excel exports → Standardized Voltage sync
      # Create the host folder, then drop .xlsx files exported from
      # http://192.168.20.12:8080/LogSheetsReports.aspx into it.
      - ${ARIAORMS_EXPORT_DIR:-./ariaorms_exports}:/data/ariaorms_exports

volumes:
  pvc_arvand_data:
